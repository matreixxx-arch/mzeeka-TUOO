<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2937" />
  <title>مزيكا توتا | لوحة التحكم</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #111827, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header, .panel {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent); }
    .btn-secondary { background: #374151; }
    .btn-danger { background: var(--danger); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .stat {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0 0;
      color: var(--accent);
    }

    .list {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 14px;
      flex-wrap: wrap;
    }

    .item span {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>لوحة التحكم</h1>
        <p>إدارة موقع مزيكا توتا من هنا</p>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="index.html">الرئيسية</a>
        <a class="btn btn-secondary" href="songs.html">الأغاني</a>
        <a class="btn btn-danger" href="login.html">تسجيل الخروج</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>عدد الأغاني</h2>
        <div class="stat">24</div>
      </div>
      <div class="card">
        <h2>الزيارات اليوم</h2>
        <div class="stat">1.2K</div>
      </div>
      <div class="card">
        <h2>الملفات المرفوعة</h2>
        <div class="stat">18</div>
      </div>
      <div class="card">
        <h2>الحالة</h2>
        <div class="stat">مفعل</div>
      </div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h2 style="margin-top:0;">اختصارات الإدارة</h2>
      <div class="list">
        <div class="item">
          <strong>رفع أغنية جديدة</strong>
          <span>جهز ملف الصوت وارفعه على الاستضافة</span>
        </div>
        <div class="item">
          <strong>تعديل صفحة الأغاني</strong>
          <span>من ملف songs.html</span>
        </div>
        <div class="item">
          <strong>تحديث المشغل</strong>
          <span>من ملف player.html</span>
        </div>
      </div>
    </div>
  </div>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
</script></body>
</html>"}]}
