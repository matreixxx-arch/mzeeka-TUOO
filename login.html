<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - مزيكا توتا</title>
  <meta name="theme-color" content="#111827" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #f97316;
      --accent-2: #fb7185;
      --border: rgba(255,255,255,.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .wrap {
      width: 100%;
      max-width: 420px;
      background: rgba(17,24,39,.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 30px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }
    p {
      margin: 0 0 22px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--accent), #f43f5e);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { opacity: .95; }
    .note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .back {
      display: inline-block;
      margin-top: 18px;
      color: #fbbf24;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">م</div>
    <h1>تسجيل الدخول</h1>
    <p>ادخل بيانات الدخول الخاصة بالمسؤول للوصول إلى لوحة التحكم.</p>

    <form action="admin.html" method="get">
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" placeholder="أدخل اسم المستخدم" required />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" required />
      </div>
      <button class="btn" type="submit">دخول</button>
    </form>

    <div class="note">بعد الرفع، اربط الصفحة هذه بلوحة التحكم أو نظام تسجيل دخول حقيقي.</div>
    <a class="back" href="index.html">رجوع للرئيسية</a>
  </main>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
</script></body>
</html>
