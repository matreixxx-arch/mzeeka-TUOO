<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>مزيكا توتا - مشغل الأغاني</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a, #111827);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 18px; color: #cbd5e1; }
    audio { width: 100%; margin: 18px 0; }
    .btn {
      display: inline-block;
      text-decoration: none;
      background: #22c55e;
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
    }
    .btn:hover { opacity: 0.9; }
    .note {
      margin-top: 16px;
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>مشغل الأغاني</h1>
    <p>اضغط تشغيل واستمتع بالموسيقى</p>
    <audio controls>
      <source src="song.mp3" type="audio/mpeg">
      المتصفح لا يدعم تشغيل الصوت.
    </audio>
    <a class="btn" href="songs.html">رجوع للأغاني</a>
    <div class="note">غيّر اسم الملف داخل عنصر الصوت إلى اسم الأغنية الحقيقي بعد الرفع.</div>
  </main>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
</script></body>
</html>
